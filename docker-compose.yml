name: jobst

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: ./api-core
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]
    profiles: [full]

  analytics-ml:
    build:
      context: ./analytics-ml
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]
    profiles: [full]

  api:
    build:
      context: ./api-core
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ANALYTICS_ML_URL: http://analytics-ml:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      analytics-ml:
        condition: service_healthy
    expose: ["5001"]
    networks: [internal]
    profiles: [full]

  web:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - analytics-ml
    networks: [internal]
    profiles: [full]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal: